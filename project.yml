name: Anky
options:
  bundleIdPrefix: dev.bolshakov
  deploymentTarget:
    iOS: "26.0"
packages:
  Anky:
    path: .
targets:
  Anky:
    type: application
    platform: iOS
    sources:
      - App
      - path: PRIVACY.md
        buildPhase: resources
    dependencies:
      - package: Anky
        product: AnkyDomain
      - package: Anky
        product: AnkyStore
      - package: Anky
        product: AnkyMedicationModel
    postBuildScripts:
      - path: scripts/set-build-number.sh
        name: Set the build number to the commit count
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    settings:
      GENERATE_INFOPLIST_FILE: YES
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      SWIFT_VERSION: "6.0"
      SWIFT_EMIT_LOC_STRINGS: YES
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
  AnkyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/AnkyUITests]
    dependencies:
      - target: Anky
      - package: Anky
        product: AnkyDomain
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "6.0"
schemes:
  Anky:
    build:
      targets:
        Anky: all
    test:
      targets: [AnkyUITests]
