name: Anky
options:
  bundleIdPrefix: com.bolshakov
  deploymentTarget:
    iOS: "17.0"
packages:
  Anky:
    path: .
targets:
  Anky:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: Anky
        product: AnkyDomain
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "6.0"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
  AnkyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/AnkyUITests]
    dependencies:
      - target: Anky
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "6.0"
schemes:
  Anky:
    build:
      targets:
        Anky: all
    test:
      targets: [AnkyUITests]
