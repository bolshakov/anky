name: Anky
options:
  bundleIdPrefix: com.bolshakov
  deploymentTarget:
    iOS: "17.0"
packages:
  Anky:
    path: .
targets:
  Anky:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: Anky
        product: AnkyDomain
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "6.0"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
