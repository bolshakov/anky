<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Where: all places</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
.b-q::placeholder{color:var(--ink2);opacity:1}
.b-scroll{scrollbar-width:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
button,.press{transition:transform 140ms cubic-bezier(.34,1.56,.64,1)}
button:active,.press:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){button,.press{transition:none}button:active,.press:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; padding: 54px 16px 34px; background: var(--surface); color: var(--ink); display: flex; flex-direction: column; gap: 12px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; {{ vars }}">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <a href="NewEntry.dc.html" style="min-width: 64px; min-height: 44px; display: flex; align-items: center; font-size: 17px; color: var(--tint)" aria-label="Back"><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block"><path d="M10 2L2 10l8 8"></path></svg></a>
    <span style="font-size: 17px; font-weight: 600">Where</span>
    <span style="min-width: 64px"></span>
  </div>

  

  <div class="b-scroll" style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px">
    <sc-if value="{{ showTip }}" hint-placeholder-val="{{ false }}">
      <div role="note" style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 4px 12px 16px; background: var(--soft); color: var(--onsoft); border-radius: 22px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M9 3h6l-1.2 6.2L17 12.5V14H7v-1.5l3.2-3.3L9 3z"></path><path d="M12 14v7" fill="none"></path></svg>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-size: 17px; line-height: 22px; font-weight: 600">Pin a shortcut</span>
          <span style="font-size: 15px; line-height: 20px">Swipe a place right to pin it as a shortcut on New Entry.</span>
        </div>
        <button aria-label="Dismiss tip" onClick="{{ closeTip }}" style="flex: none; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: var(--onsoft)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg></button>
      </div>
    </sc-if>
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="padding: 0; font-size: 13px; line-height: 18px; color: var(--ink2)">{{ g.title }}</span>
        <div style="background: var(--card); border-radius: 22px; overflow: hidden">
          <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="3">
            <sc-if value="{{ r.single }}" hint-placeholder-val="{{ true }}">
              <div style="position: relative; overflow: hidden; border-top: {{ r.border }}; background: {{ r.wrapBg }}">
                <button aria-label="{{ r.pinWord }} {{ r.label }} as shortcut" onClick="{{ r.togglePin }}" style="position: absolute; left: 0; top: 0; bottom: 0; width: 88px; display: {{ r.actionShow }}; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: var(--surface); color: var(--ink2); border: 0; font-size: 13px; line-height: 16px">
                  <span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: 15px; background: var(--tint); color: var(--ontint)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1.2 6.2L17 12.5V14H7v-1.5l3.2-3.3L9 3z"></path><path d="M12 14v7" fill="none"></path><path d="M4 21L20 3" fill="none" stroke-width="2.2" style="display: {{ r.pinIcon }}"></path></svg>
                  </span>
                  {{ r.pinWord }}
                </button>
                <button aria-pressed="{{ r.pressed }}" onClick="{{ r.toggle }}" style="position: relative; display: flex; align-items: center; justify-content: space-between; width: 100%; box-sizing: border-box; min-height: {{ r.rowH }}; margin: {{ r.rowMargin }}; padding: 0 16px 0 32px; background: {{ r.rowBg }}; border: 0; transform: translateX({{ r.shift }}); border-radius: {{ r.rowRadius }}; font-size: 17px; font-weight: {{ r.fw }}; text-align: left">
                  <span style="display: flex; align-items: center; min-width: 0">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 10px; top: 50%; margin-top: -6px; display: {{ r.pinIcon }}; color: var(--ink2)"><path d="M9 3h6l-1.2 6.2L17 12.5V14H7v-1.5l3.2-3.3L9 3z"></path><path d="M12 14v7" fill="none"></path></svg>
                    <span>{{ r.label }}</span>
                  </span>
                  <span style="display: flex; align-items: center">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="stroke: var(--tint)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="{{ r.chk }}" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                  </span>
                </button>
              </div>
            </sc-if>
            <sc-if value="{{ r.pair }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 4px 12px 4px 16px; border-top: {{ r.border }}">
                <span style="font-size: 17px">{{ r.label }}</span>
                <div style="display: flex; gap: 8px" role="group" aria-label="{{ r.label }}">
                  <button aria-pressed="{{ r.lPressed }}" aria-label="Left {{ r.label }}" onClick="{{ r.toggleL }}" style="display: flex; align-items: center; justify-content: center; gap: 4px; min-width: 64px; min-height: 44px; padding: 0 12px; background: {{ r.lBg }}; color: {{ r.lFg }}; border: 0; border-radius: 999px; font-size: 15px; font-weight: {{ r.lFw }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display: {{ r.lChk }}" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Left</button>
                  <button aria-pressed="{{ r.rPressed }}" aria-label="Right {{ r.label }}" onClick="{{ r.toggleR }}" style="display: flex; align-items: center; justify-content: center; gap: 4px; min-width: 64px; min-height: 44px; padding: 0 12px; background: {{ r.rBg }}; color: {{ r.rFg }}; border: 0; border-radius: 999px; font-size: 15px; font-weight: {{ r.rFw }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display: {{ r.rChk }}" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Right</button>
                </div>
              </div>
            </sc-if>
          </sc-for>
        </div>
      </div>
    </sc-for>
    <sc-if value="{{ none }}" hint-placeholder-val="{{ false }}">
      <div style="padding: 48px 32px; text-align: center; font-size: 16px; line-height: 21px; color: var(--ink2)">No match. Try another word, like “knee” or “jaw”.</div>
    </sc-if>
    <span style="padding: 0 0 8px; font-size: 13px; line-height: 18px; color: var(--ink2)">One severity covers every place you pick. Log separate entries if they differ.</span>
  </div><div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; background: var(--card); border-radius: 22px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="stroke: var(--ink2)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    <input class="b-q" type="text" value="{{ q }}" onInput="{{ onQ }}" placeholder="Search joints and places" aria-label="Search joints and places" style="flex: 1; min-width: 0; height: 44px; padding: 0; background: transparent; border: 0; outline: none; font-family: inherit; font-size: 17px; color: var(--ink)">
  </div>

  <a class="press" href="NewEntry.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; width: 100%; background: var(--tint); color: var(--ontint); border-radius: 28px; font-size: 17px; font-weight: 600">{{ doneLabel }}</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;},&quot;tip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;swipe&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    const L = { surface: '#f2f2f7', card: '#ffffff', ink: '#000000', ink2: '#636366', sep: '#d1d1d6', tint: '#c23c14', ontint: '#ffffff', soft: '#fbe5de', onsoft: '#a83316', ring: '#0a5cff', lift: '#e8e8ed' };
    const D = { surface: '#000000', card: '#1c1c1e', ink: '#ffffff', ink2: '#aeaeb2', sep: '#38383a', tint: '#ff7a50', ontint: '#1a0a04', soft: '#3a1f16', onsoft: '#ffb59e', ring: '#6ea0ff', lift: '#2c2c2e' };
    const t = this.props.theme === 'dark' ? D : L;
    const vars = Object.keys(t).map((k) => '--' + k + ':' + t[k]).join(';');
    const st = this.state || {};
    const sel = st.sel || { lower: true, si_l: true, si_r: true };
    const q = (st.q || '').trim().toLowerCase();
    const pins = st.pins || { neck: true, lower: true };
    const swipeId = (this.props.swipe || '').trim();
    const flipPin = (id) => () => {
      const cur = (this.state && this.state.pins) || { neck: true, lower: true };
      this.setState({ pins: Object.assign({}, cur, { [id]: !cur[id] }) });
    };
    const flip = (id) => () => {
      const cur = (this.state && this.state.sel) || { lower: true, si_l: true, si_r: true };
      this.setState({ sel: Object.assign({}, cur, { [id]: !cur[id] }) });
    };
    const G = [
      { title: 'Spine', rows: [['neck', 'Neck'], ['upper', 'Upper back'], ['lower', 'Lower back'], ['tail', 'Tailbone']] },
      { title: 'Pelvis and chest', rows: [['si', 'SI joint', 1], ['hip', 'Hip', 1], ['ribs', 'Ribs'], ['chest', 'Chest wall']] },
      { title: 'Arms', rows: [['shoulder', 'Shoulder', 1], ['elbow', 'Elbow', 1], ['wrist', 'Wrist', 1], ['hand', 'Hand and fingers', 1]] },
      { title: 'Legs', rows: [['knee', 'Knee', 1], ['ankle', 'Ankle', 1], ['foot', 'Foot and toes', 1], ['heel', 'Heel', 1]] },
      { title: 'Head', rows: [['jaw', 'Jaw'], ['eye', 'Eyes']] }
    ];
    let count = 0;
    const groups = [];
    const low = (s) => (s.indexOf('SI') === 0 ? s : s.charAt(0).toLowerCase() + s.slice(1));
    G.forEach((g) => {
      g.rows = g.rows.reduce((acc, r) => {
        if (r[2]) { acc.push([r[0] + '_l', 'Left ' + low(r[1])], [r[0] + '_r', 'Right ' + low(r[1])]); } else { acc.push(r); }
        return acc;
      }, []);
    });
    G.forEach((g) => {
      const hit = g.rows.filter((r) => !q || r[1].toLowerCase().indexOf(q) >= 0 || g.title.toLowerCase().indexOf(q) >= 0);
      if (!hit.length) return;
      groups.push({
        title: g.title,
        rows: hit.map((r, i) => {
          const border = i === 0 ? '0' : '0.5px solid var(--sep)';
          if (!r[2]) {
            const on = !!sel[r[0]];
            const pinned = !!pins[r[0]];
            const swiped = swipeId === r[0];
            return { single: true, pair: false, label: r[1], border: border, pressed: on, chk: on ? 1 : 0, fw: on ? 600 : 400, toggle: flip(r[0]), pinned: pinned, pinIcon: pinned ? 'block' : 'none', pinWord: pinned ? 'Unpin' : 'Pin', shift: swiped ? '88px' : '0', actionShow: swiped ? 'flex' : 'none', rowRadius: swiped ? '20px' : '0', rowH: '60px', wrapBg: swiped ? 'var(--surface)' : 'transparent', rowMargin: '0', rowBg: swiped ? 'var(--lift)' : 'var(--card)', togglePin: flipPin(r[0]) };
          }
          const l = !!sel[r[0] + '_l'];
          const rr = !!sel[r[0] + '_r'];
          return {
            single: false, pair: true, label: r[1], border: border,
            lPressed: l, rPressed: rr, lChk: l ? 'block' : 'none', rChk: rr ? 'block' : 'none',
            lBg: l ? 'var(--tint)' : 'var(--surface)', lFg: l ? 'var(--ontint)' : 'var(--ink)', lFw: l ? 600 : 400,
            rBg: rr ? 'var(--tint)' : 'var(--surface)', rFg: rr ? 'var(--ontint)' : 'var(--ink)', rFw: rr ? 600 : 400,
            toggleL: flip(r[0] + '_l'), toggleR: flip(r[0] + '_r')
          };
        })
      });
    });
    Object.keys(sel).forEach((k) => { if (sel[k]) count++; });
    return {
      vars: vars,
      showTip: (this.props.tip === true || this.props.tip === 'true') && !st.tipGone,
      closeTip: () => this.setState({ tipGone: true }),
      q: st.q || '',
      onQ: (e) => this.setState({ q: e.target.value }),
      groups: groups,
      none: groups.length === 0,
      doneLabel: count === 0 ? 'Done' : 'Done · ' + count + (count === 1 ? ' place' : ' places')
    };
  }
}
</script>
</body>
</html>
