<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose a reading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
.n-scroll{scrollbar-width:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; padding: 54px 16px 34px; background: var(--surface); color: var(--ink); display: flex; flex-direction: column; gap: 12px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; {{ vars }}">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <a href="LogDose.dc.html" style="min-width: 64px; min-height: 44px; display: flex; align-items: center; font-size: 17px; color: var(--tint)">Cancel</a>
    <span style="font-size: 17px; font-weight: 600">Before this dose</span>
    <span style="min-width: 64px"></span>
  </div>

  <div class="n-scroll" style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 12px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="padding: 0; font-size: 13px; line-height: 18px; color: var(--ink2)">Recent entries</span>
      <div style="background: var(--card); border-radius: 22px; overflow: hidden">
        <a href="LogDose.dc.html" aria-label="Lower back, SI joints, Pain · Today, 08:15, 4 of 10, selected" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; border-top: 0">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 17px; line-height: 22px; font-weight: 600">Lower back, SI joints</span>
            <span style="font-size: 13px; line-height: 18px; color: var(--ink2)">Pain · Today, 08:15</span>
          </div>
          <span aria-hidden="true" style="font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">4 <span style="font-weight: 400; color: var(--ink2)">of 10</span></span>
          <span style="width: 18px; display: flex; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="stroke: var(--tint)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
        </a>
        <a href="LogDose.dc.html" aria-label="Lower back, Stiffness · Today, 07:40, 5 of 10" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; border-top: 0.5px solid var(--sep)">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 17px; line-height: 22px; font-weight: 400">Lower back</span>
            <span style="font-size: 13px; line-height: 18px; color: var(--ink2)">Stiffness · Today, 07:40</span>
          </div>
          <span aria-hidden="true" style="font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">5 <span style="font-weight: 400; color: var(--ink2)">of 10</span></span>
          <span style="width: 18px; display: flex; align-items: center"></span>
        </a>
        <a href="LogDose.dc.html" aria-label="Neck, Pain · Today, 06:50, 3 of 10" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; border-top: 0.5px solid var(--sep)">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 17px; line-height: 22px; font-weight: 400">Neck</span>
            <span style="font-size: 13px; line-height: 18px; color: var(--ink2)">Pain · Today, 06:50</span>
          </div>
          <span aria-hidden="true" style="font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">3 <span style="font-weight: 400; color: var(--ink2)">of 10</span></span>
          <span style="width: 18px; display: flex; align-items: center"></span>
        </a>
      </div>
      <span style="padding: 0; font-size: 13px; line-height: 18px; color: var(--ink2)">Pain and stiffness entries from the 2 hours before this dose.</span>
    </div>
    <div style="background: var(--card); border-radius: 22px; overflow: hidden">
      <a href="NewEntry.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 8px 16px; font-size: 17px; color: var(--tint)">
        <span>Log how you feel now</span>
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none" style="stroke: var(--ink2); flex: none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5l5 5.5-5 5.5"></path></svg>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const L = { surface: '#f2f2f7', card: '#ffffff', ink: '#000000', ink2: '#636366', sep: '#d1d1d6', tint: '#c23c14', ontint: '#ffffff', ring: '#0a5cff' };
    const D = { surface: '#000000', card: '#1c1c1e', ink: '#ffffff', ink2: '#aeaeb2', sep: '#38383a', tint: '#ff7a50', ontint: '#1a0a04', ring: '#6ea0ff' };
    const t = this.props.theme === 'dark' ? D : L;
    const vars = Object.keys(t).map((k) => '--' + k + ':' + t[k]).join(';');
    return { vars: vars };
  }
}
</script>
</body>
</html>
