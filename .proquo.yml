failOn: red

exclude:
  - "**/Package.resolved"
  - "**/Contents.json"
  - "**/project.pbxproj"
  - "**/*.xcscheme"
  - "**/*.xcstrings"
  - "**/*.xcworkspacedata"
  - ".claude/skills/*/references/**"
  - "LICENSE"

weights:
  - pattern: "**/Tests/**"
    weight: 0.5
  - pattern: "**/*Tests/**"
    weight: 0.5
